<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAVOC - Tutoriel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.5/ace.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="win.css" />
    <link rel="stylesheet" href="option_window.css">
    <link rel="stylesheet" href="tuto.css">
    <link rel="shortcut icon" href="./" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="common.js"></script>
  </head>

  <body>
    <div id="tuto-badge">
      <span class="tuto-title">&#127891; TUTORIEL</span>
      <span id="level-indicator" style="font-size: 14px; color: #f8f8f2;">Niveau 1</span>
    </div>

    <script>
      cavocMount(cavocEditorsMarkup({
        codeTitle: 'Code OCaml',
        signatureTitle: 'Signature OCaml',
      }));
    </script>

    <!-- The tutorial sets these from the level's JSON file rather than from the
         options menu, so they are present but never shown. -->
    <div style="display: none;">
      <input type="checkbox" id="direct-style-check">
      <input type="checkbox" id="wellbracketing-check">
      <input type="checkbox" id="visibility-check">
      <input type="checkbox" id="debug-log-check">
      <input type="checkbox" id="symbolic-check">
    </div>

    <script>
      cavocMount(cavocWorkspaceMarkup({ optionsMenu: false, configNav: false }));
      cavocInitAce();
    </script>

    <script src="../_build/default/bin/explore_web.bc.js"></script>
  </body>

  <script>
    /* === Global declarations === */
    const cavocCurrentLevelName = 'cavoc-current-level';
    let   currentLevel = localStorage.getItem(cavocCurrentLevelName);

    // Valeurs par défaut si le fichier JSON est manquant ou incomplet
    const DEFAULT_CONFIG = { 
        directStyle: false, 
        wellBracketing: false, 
        visibility: false 
    };

    // Declared here because it is required by onSuccess and nextLevel
    const successModal = createModal('success', false);
    const tutoEndModal = createModal('tutoEnd', false);

    function nextLevel() {
        currentLevel++;
        localStorage.setItem(cavocCurrentLevelName, currentLevel);

        loadLevel(currentLevel);
    }

    // Called by OCaml (see evaluate_code.ml) after a success
    function onSuccess(message) {
        setModalMessage(successModal, "Game stopped: " + message);
        openModal(successModal);
    }

    setModalTitle(successModal, "🏆 SUCCÈS !");
    addModalButton(successModal, "Niveau suivant >>", _ => {
        nextLevel();
        closeModal(successModal);
    });

    setModalTitle(tutoEndModal, "🏆 SUCCÈS !");
    setModalMessage(tutoEndModal, "Vous avez terminé le tutoriel. Félicitations !");
    addModalButton(tutoEndModal, "Réinitialiser le tutoriel", _ => {
        currentLevel = 0;

        nextLevel();
        closeModal(tutoEndModal);
    });
    addModalButton(tutoEndModal, "Passer à la suite", _ => {
        window.location.href = "index.html";
    });

    if(currentLevel === null) {
        currentLevel = 1;
    }

    // Fonction principale pour charger un niveau
    async function loadLevel(level) {
        console.log(`Chargement du niveau ${level}...`);
        
        // 1. Mise à jour visuelle du badge
        document.getElementById("level-indicator").innerText = "Niveau " + level;

        // Définition des noms de fichiers
        const jsonFileName = `tuto${level}.json`;
        const mlFileName = `tuto${level}.ml`;
        const mliFileName = `tuto${level}.mli`;
        const hintFileName = `tuto${level}.md`;
        
        // Définition du nom de fichier exposé au lexer OCaml
        window.loadedFile = `tudo${level}`;

        // ---------------------------------------------------------
        // ETAPE A : CHARGEMENT DE LA CONFIGURATION (JSON)
        // ---------------------------------------------------------
        try {
            const response = await fetch(`../tuto/${jsonFileName}`);
            
            let config = DEFAULT_CONFIG;
            
            if (response.ok) {
                config = await response.json();
            } else {
                console.warn(`Fichier ${jsonFileName} introuvable, utilisation des paramètres par défaut.`);
            }

            // Application des options aux cases à cocher cachées
            // L'opérateur '||' assure une valeur par défaut si une clé manque dans le JSON
            document.getElementById('direct-style-check').checked = config.directStyle || false;
            document.getElementById('wellbracketing-check').checked = config.wellBracketing || false;
            document.getElementById('visibility-check').checked = config.visibility || false;
            document.getElementById('symbolic-check').checked = config.symbolic || false;

        } catch (error) {
            console.error("Erreur lors de la lecture du JSON de config :", error);
            // En cas d'erreur technique, on applique les défauts pour ne pas bloquer
            document.getElementById('direct-style-check').checked = false;
            document.getElementById('wellbracketing-check').checked = false;
            document.getElementById('visibility-check').checked = false;
            document.getElementById('symbolic-check').checked = false;
        }

        // ---------------------------------------------------------
        // ETAPE B : CHARGEMENT DU CODE OCAML (.ml et .mli)
        // ---------------------------------------------------------
        
        // On charge le .ml
        fetch(`../tuto/${mlFileName}`)
          .then((response) => {
              if (!response.ok) throw new Error("Fini"); // Si le .ml n'existe pas, c'est la fin du jeu
              return response.text();
          })
          .then((mlContent) => {
            // Mise à jour de l'éditeur principal
            editor.session.setValue(mlContent);
            
            // On charge le .mli (optionnel)
            return fetch(`../tuto/${mliFileName}`);
          })
          .then((response) => {
              if (response.ok) return response.text();
              return ""; // Si pas de .mli, on renvoie vide
          })
          .then((mliContent) => {
              signatureEditor.session.setValue(mliContent);
              document.getElementById('submit').click();
                        return fetch(`../tuto/${hintFileName}`)
          })
          .then((hintResp) => {
            if (hintResp.ok) return hintResp.text();
            return "";
          })
          .then((hintText) => {
            if (hintText != "") {
              let text = marked.parse(hintText);
              let modal = createModal(mlFileName, true);
              setModalMessage(modal, text);
              openModal(modal);
            }
          })
          .catch((error) => {
             if (error.message === "Fini") {
                 // Gestion de la fin du tutoriel
                 openModal(tutoEndModal);
             } else {
                 console.error("Erreur chargement code :", error);
             }
          });
    }

    // Démarrage au chargement de la page
    window.onload = function () {
      loadLevel(currentLevel);
    };
  </script>
</html>
