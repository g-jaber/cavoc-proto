<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CAVOC</title>
        <script src="vendor/ace/ace.js"></script>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="win.css">
        <link rel="stylesheet" href="option_window.css">
        <link rel="shortcut icon" href="./" type="image/x-icon" />
        <script src="vendor/marked/marked.min.js"></script>
        <script src="common.js"></script>
        <script src="scenario.js"></script>
    </head>

    <body>
        <script>
            /* Ace lazily loads mode/theme files from its base path; setting
               it explicitly keeps the lookup local wherever the page is
               hosted. */
            ace.config.set('basePath', 'vendor/ace');
            cavocMount(cavocToolbarMarkup());
            cavocMount(cavocWorkspaceMarkup());
            cavocInitAce();
        </script>

        <script src="../_build/default/bin/explore_web.bc.js"></script>

        <!-- After the engine: the OCaml side has installed its handlers and
             exported cavocToggleDebug by now. -->
        <script> cavocPageInit(); </script>
    </body>
</html>
