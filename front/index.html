<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CAVOC</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.5/ace.js"></script>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="win.css">
        <link rel="stylesheet" href="option_window.css">
        <link rel="shortcut icon" href="./" type="image/x-icon" />
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="common.js"></script>
    </head>

    <body>
        <script>
            cavocMount(cavocEditorsMarkup({
                codeTitle: 'Module',
                signatureTitle: 'Signature',
            }));
        </script>

        <div id="file-selection" class="file-selection-container">
            <label for="file-select-dropdown">Select a file:</label>
            <select id="file-select-dropdown" class="file-select">
            </select>
            <button id="load-btn" class="load-btn">Load</button>
        </div>

        <script>
            cavocMount(cavocWorkspaceMarkup({ optionsMenu: true, configNav: true }));
            cavocInitAce();
        </script>

        <script src="../_build/default/bin/explore_web.bc.js"></script>
    </body>

    <script>
        const successModal = createModal('success', true);

        setModalTitle(successModal, "Interaction ended");
        addModalButton(successModal, "Ok", (_) => closeModal(successModal));

        // Called by OCaml (see evaluate_code.ml) once the interaction is over
        function onSuccess(message) {
            setModalMessage(successModal, message);
            openModal(successModal);
        }

        const debugLogCheck = document.getElementById('debug-log-check');
        debugLogCheck.addEventListener('change', (e) => {
            cavocToggleDebug(e.target.checked);
        });

        window.onload = async function () {
            // --- The modules offered in the dropdown come from test/ ---

            let filesList = [];
            try {
                // Ask the server to list the files of the test directory
                const response = await fetch('http://localhost:8000/list_files?dir=test');
                filesList = await response.json();
            }
            catch(e){
                console.log("Error loading the file list:", e);
            }

            // Filter the list to get only the .ml files
            const mlFiles = filesList.filter((file) => file.endsWith(".ml"));

            // Populate the dropdown with the .ml file names
            const fileSelect = document.getElementById("file-select-dropdown");
            mlFiles.forEach((file) => {
                const option = document.createElement("option");
                option.value = file;
                option.text = file;
                fileSelect.appendChild(option);
            });

            // Set default file if available
            if(mlFiles.length > 0) fileSelect.value = mlFiles[0];

            // Load button listener
            document
                .getElementById("load-btn")
                .addEventListener("click", function () {
                    const selectedFileName = document.getElementById("file-select-dropdown").value;

                    if (selectedFileName) {
                        const mlFileName = selectedFileName;
                        const mliFileName = mlFileName.replace(".ml", ".mli");

                        window.loadedFile = selectedFileName.slice(0, -3);

                        // Load .ml file content from TEST directory
                        fetch(`../test/${mlFileName}`)
                            .then((response) => response.text())
                            .then((mlContent) => {
                                editor.session.setValue(mlContent);
                            })
                            .catch((error) => console.error("Error loading .ml file:", error));

                        // Load .mli file content from TEST directory
                        fetch(`../test/${mliFileName}`)
                            .then((response) => response.text())
                            .then((mliContent) => {
                                signatureEditor.session.setValue(mliContent);
                            })
                            .catch((error) => {
                                console.error("Error loading .mli file:", error);
                                signatureEditor.session.setValue("");
                            });
                    }
                });

            // Trigger initial load
            if(mlFiles.length > 0) {
                document.getElementById("load-btn").click();
            }
        };

        // Options menu
        document.getElementById('options-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            const menu = document.getElementById('options-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        });

        // Close the menu when clicking anywhere else
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('options-menu');
            const btn = document.getElementById('options-btn');
            if (menu.style.display === 'block' && !menu.contains(e.target) && e.target !== btn) {
                menu.style.display = 'none';
            }
        });

        // Direct Style implies WellBracketing
        const directStyleCheck = document.getElementById('direct-style-check');
        const wellBracketingCheck = document.getElementById('wellbracketing-check');

        directStyleCheck.addEventListener('change', function() {
            if (this.checked) {
                // Force WellBracketing on, and lock it so it cannot be unticked
                wellBracketingCheck.checked = true;
                wellBracketingCheck.disabled = true;
            } else {
                // Unlock it again: the user is free to keep it or not
                wellBracketingCheck.disabled = false;
            }
        });
    </script>
</html>
