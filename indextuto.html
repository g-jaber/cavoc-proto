<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAVOC - Tutorial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.5/ace.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="win.css" />
    <link rel="stylesheet" href="option_window.css">
    <link rel="stylesheet" href="tuto.css">
    <link rel="shortcut icon" href="./" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="common.js"></script>
  </head>

  <body>
    <div id="tuto-badge">
      <span class="tuto-title">&#127891; TUTORIAL</span>
      <span id="level-indicator" style="font-size: 14px; color: #f8f8f2;">Level 1</span>
    </div>

    <script>
      cavocMount(cavocEditorsMarkup({
        codeTitle: 'Code OCaml',
        signatureTitle: 'Signature OCaml',
      }));
    </script>

    <!-- The tutorial sets these from the level's JSON file rather than from the
         options menu, so they are present but never shown. -->
    <div style="display: none;">
      <input type="checkbox" id="direct-style-check">
      <input type="checkbox" id="wellbracketing-check">
      <input type="checkbox" id="visibility-check">
      <input type="checkbox" id="debug-log-check">
      <input type="checkbox" id="symbolic-check">
    </div>

    <script>
      cavocMount(cavocWorkspaceMarkup({ optionsMenu: false, configNav: false }));
      cavocInitAce();
    </script>

    <script src="../_build/default/bin/explore_web.bc.js"></script>
  </body>

  <script>
    /* === Global declarations === */
    const cavocCurrentLevelName = 'cavoc-current-level';
    let   currentLevel = localStorage.getItem(cavocCurrentLevelName);

    // Default settings, used when the level's JSON file is missing or incomplete
    const DEFAULT_CONFIG = { 
        directStyle: false, 
        wellBracketing: false, 
        visibility: false 
    };

    // Declared here because it is required by onSuccess and nextLevel
    const successModal = createModal('success', false);
    const tutoEndModal = createModal('tutoEnd', false);

    function nextLevel() {
        currentLevel++;
        localStorage.setItem(cavocCurrentLevelName, currentLevel);

        loadLevel(currentLevel);
    }

    // Called by OCaml (see evaluate_code.ml) once the interaction is over
    function onSuccess(message) {
        setModalMessage(successModal, message);
        openModal(successModal);
    }

    setModalTitle(successModal, "🏆 SUCCESS");
    addModalButton(successModal, "Next level >>", _ => {
        nextLevel();
        closeModal(successModal);
    });

    setModalTitle(tutoEndModal, "🏆 SUCCESS");
    setModalMessage(tutoEndModal, "You have completed the tutorial. Congratulations!");
    addModalButton(tutoEndModal, "Restart the tutorial", _ => {
        currentLevel = 0;

        nextLevel();
        closeModal(tutoEndModal);
    });
    addModalButton(tutoEndModal, "Continue to free play", _ => {
        window.location.href = "index.html";
    });

    if(currentLevel === null) {
        currentLevel = 1;
    }

    // Loads a level: its settings, its code, and its hint.
    async function loadLevel(level) {
        console.log(`Loading level ${level}...`);

        // 1. Update the badge
        document.getElementById("level-indicator").innerText = "Level " + level;

        // The files making up a level
        const jsonFileName = `tuto${level}.json`;
        const mlFileName = `tuto${level}.ml`;
        const mliFileName = `tuto${level}.mli`;
        const hintFileName = `tuto${level}.md`;
        
        // The file name reported by the OCaml lexer in its error messages
        window.loadedFile = `tuto${level}`;

        // ---------------------------------------------------------
        // STEP A: LOAD THE SETTINGS (JSON)
        // ---------------------------------------------------------
        try {
            const response = await fetch(`../tuto/${jsonFileName}`);
            
            let config = DEFAULT_CONFIG;
            
            if (response.ok) {
                config = await response.json();
            } else {
                console.warn(`${jsonFileName} not found, using the default settings.`);
            }

            // Apply the settings to the hidden checkboxes. The '||' operator
            // supplies a default when a key is missing from the JSON.
            document.getElementById('direct-style-check').checked = config.directStyle || false;
            document.getElementById('wellbracketing-check').checked = config.wellBracketing || false;
            document.getElementById('visibility-check').checked = config.visibility || false;
            document.getElementById('symbolic-check').checked = config.symbolic || false;

        } catch (error) {
            console.error("Error reading the level configuration:", error);
            // Fall back to the defaults, so that a broken file does not block the level
            document.getElementById('direct-style-check').checked = false;
            document.getElementById('wellbracketing-check').checked = false;
            document.getElementById('visibility-check').checked = false;
            document.getElementById('symbolic-check').checked = false;
        }

        // ---------------------------------------------------------
        // STEP B: LOAD THE OCAML CODE (.ml and .mli)
        // ---------------------------------------------------------

        // Load the .ml
        fetch(`../tuto/${mlFileName}`)
          .then((response) => {
              // No .ml for this level means the tutorial is over
              if (!response.ok) throw new Error("TutorialComplete");
              return response.text();
          })
          .then((mlContent) => {
            editor.session.setValue(mlContent);

            // Load the .mli, which is optional
            return fetch(`../tuto/${mliFileName}`);
          })
          .then((response) => {
              if (response.ok) return response.text();
              return ""; // No .mli: leave the signature editor empty
          })
          .then((mliContent) => {
              signatureEditor.session.setValue(mliContent);
              document.getElementById('submit').click();
                        return fetch(`../tuto/${hintFileName}`)
          })
          .then((hintResp) => {
            if (hintResp.ok) return hintResp.text();
            return "";
          })
          .then((hintText) => {
            if (hintText != "") {
              let text = marked.parse(hintText);
              let modal = createModal(mlFileName, true);
              setModalMessage(modal, text);
              openModal(modal);
            }
          })
          .catch((error) => {
             if (error.message === "TutorialComplete") {
                 openModal(tutoEndModal);
             } else {
                 console.error("Error loading the level code:", error);
             }
          });
    }

    // Start the tutorial when the page loads
    window.onload = function () {
      loadLevel(currentLevel);
    };
  </script>
</html>
